<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radioactive Plant Survival</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Radioactive Plant Survival</h1>

<div class="ui">
  <div class="control">
    <label>Years Survived</label>
    <span id="timer">0</span>
  </div>

  <div class="control">
    <label>Radiation relative to Cobalt Bomb </label>
    <input type="range" id="radiation" min="0" max="100" value="24">
    <span id="radValue">24</span>
  </div>

  <div class="control">
    <label>Fertilizer</label>
    <select id="fertilizer">
      <option value="none">None</option>
      <option value="organic">Organic</option>
      <option value="nitrogen">Nitrogen</option>
      <option value="shielded">Shielded</option>
    </select>
  </div>

  <div class="control">
    <label>Game Speed</label>
    <input type="range" id="speed" min="2" max="20" value="10">
    <span id="speedValue">10s/year</span>
  </div>

  <div class="stats">
    🌱 Alive: <span id="alive">0</span>
    🧬 Mutated: <span id="mutated">0</span>
  </div>

  <button onclick="resetGame()">Restart</button>
</div>

<canvas id="canvas" width="900" height="450"></canvas>

<script src="script.js"></script>
</body>
</html>
